kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: dcgm-server
  namespace: {{ .Release.Namespace }}
  labels:
    k8s-app: dcgm-server
    version: v1
spec:
  selector:
    matchLabels:
      k8s-app: dcgm-server
      version: v1
  updateStrategy:
  {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        k8s-app: dcgm-server
        version: v1
        {{- $podLabels := merge (.Values.dcgmAgent.podLabels | default dict) (.Values.global.podLabels | default dict) }}
        {{- with $podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $podAnnotations := merge (.Values.dcgmAgent.podAnnotations | default dict) (.Values.global.podAnnotations | default dict) }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.dcgmAgent.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dcgmAgent.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        kubernetes.io/os: linux
        {{- with .Values.dcgmAgent.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      priorityClassName: {{ .Values.priorityClassName | default "system-node-critical" }}
      containers:
        - name: {{ .Chart.Name }}-dcgm
          image: {{ template "dcgm-server.image" . }}
          imagePullPolicy: {{ .Values.dcgmAgent.image.pullPolicy }}
          command: ["/usr/bin/nv-hostengine"]
          args: ["-n", "-b", "ALL"]
          {{- /*
          NVIDIA_* are required for the NVIDIA container runtime to expose the
          GPUs and inject the host driver libraries (libnvidia-ml.so) that
          nv-hostengine needs. Without them the host engine still starts and
          serves port 5555, but reports zero GPUs, which silently disables all
          GPU health detection. The dcgm-exporter image used previously carried
          these in its image config; they must be set explicitly now.
          */}}
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility,compat32
            - name: NVIDIA_DISABLE_REQUIRE
              value: "true"
          {{- with .Values.dcgmAgent.resizePolicy }}
          resizePolicy:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.dcgmAgent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
          - containerPort: 5555
            hostPort: 5555
          securityContext:
            privileged: true
