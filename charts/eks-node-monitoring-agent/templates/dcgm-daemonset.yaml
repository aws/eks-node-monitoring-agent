{{- $metrics := .Values.dcgmAgent.metrics | default dict }}
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: dcgm-server
  namespace: {{ .Release.Namespace }}
  labels:
    k8s-app: dcgm-server
    version: v1
spec:
  selector:
    matchLabels:
      k8s-app: dcgm-server
      version: v1
  updateStrategy:
  {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        k8s-app: dcgm-server
        version: v1
        {{- $podLabels := merge (.Values.dcgmAgent.podLabels | default dict) (.Values.global.podLabels | default dict) }}
        {{- with $podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $podAnnotations := merge (.Values.dcgmAgent.podAnnotations | default dict) (.Values.global.podAnnotations | default dict) }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.dcgmAgent.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dcgmAgent.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        kubernetes.io/os: linux
        {{- with .Values.dcgmAgent.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      priorityClassName: {{ .Values.dcgmAgent.priorityClassName | default "system-node-critical" }}
      containers:
        - name: {{ .Chart.Name }}-dcgm
          image: {{ template "dcgm-server.image" . }}
          imagePullPolicy: {{ .Values.dcgmAgent.image.pullPolicy }}
          {{- if $metrics.enabled }}
          {{- /*
          Metrics opt-in: start dcgm-exporter as a best-effort background
          process that self-restarts until the host engine is reachable, then
          exec nv-hostengine so it remains PID 1. Keeping the engine as PID 1 is
          the health invariant: an engine crash must still exit the container so
          it restarts and GPU-node readiness (which gates on the engine) is
          protected. The exporter is deliberately never allowed to keep the
          container alive on its own.
          */}}
          command: ["/usr/bin/sh", "-c"]
          args:
            - "( while true; do /usr/bin/dcgm-exporter -r localhost:5555 -a :{{ $metrics.port | default 9400 }} -k || true; sleep 5; done ) & exec /usr/bin/nv-hostengine -n -b ALL"
          {{- else }}
          command: ["/usr/bin/nv-hostengine"]
          args: ["-n", "-b", "ALL"]
          {{- end }}
          {{- /*
          NVIDIA_* are required for the NVIDIA container runtime to expose the
          GPUs and inject the host driver libraries (libnvidia-ml.so) that
          nv-hostengine needs. Without them the host engine still starts and
          serves port 5555, but reports zero GPUs, which silently disables all
          GPU health detection. The dcgm-exporter image used previously carried
          these in its image config; they must be set explicitly now.
          */}}
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility,compat32
            - name: NVIDIA_DISABLE_REQUIRE
              value: "true"
          {{- with .Values.dcgmAgent.resizePolicy }}
          resizePolicy:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.dcgmAgent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
          - containerPort: 5555
            hostPort: 5555
          {{- if $metrics.enabled }}
          - containerPort: {{ $metrics.port | default 9400 }}
            name: metrics
            protocol: TCP
          {{- end }}
          {{- if $metrics.enabled }}
          volumeMounts:
            # dcgm-exporter -k reads the kubelet pod-resources socket to map
            # GPU metrics to the pods consuming them.
            - name: pod-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
          {{- end }}
          securityContext:
            privileged: true
      {{- if $metrics.enabled }}
      volumes:
        - name: pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
      {{- end }}
