{{- if include "eks-node-monitoring-agent.hasAgentConfig" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eks-node-monitoring-agent.fullname" . }}-monitor-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eks-node-monitoring-agent.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- with .Values.nodeAgent.monitors }}
    monitors:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.nodeAgent.telemetry }}
    {{- if .enabled }}
    telemetry:
      enabled: true
      {{- with .report }}
      report:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .targetDefaults }}
      targetDefaults:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .targets }}
      targets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
