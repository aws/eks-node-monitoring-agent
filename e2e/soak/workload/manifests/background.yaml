# Steady background load for the NMA soak test: 1000 pods across the "soak"
# node pool. The pool's kubelet maxPods (110) caps each node at roughly 100
# workload pods, so the autoscaler settles at about 10 nodes. Each flavor
# exercises a different set of NMA monitors.
#
# Replica counts must sum to 1000 (enforced by workload_test.go).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idle
  namespace: {{ .Namespace }}
  labels: &labels
    app.kubernetes.io/part-of: nma-soak
    app.kubernetes.io/component: background
    nma-soak/flavor: idle
spec:
  # container and pod bookkeeping with minimal resource usage.
  replicas: 290
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      nodeSelector:
        nma-soak/pool: soak
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *labels
      terminationGracePeriodSeconds: 5
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Namespace }}
  labels: &labels
    app.kubernetes.io/part-of: nma-soak
    app.kubernetes.io/component: background
    nma-soak/flavor: web
spec:
  # pod networking and probe traffic on every node.
  replicas: 200
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      nodeSelector:
        nma-soak/pool: soak
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *labels
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-burner
  namespace: {{ .Namespace }}
  labels: &labels
    app.kubernetes.io/part-of: nma-soak
    app.kubernetes.io/component: background
    nma-soak/flavor: cpu-burner
spec:
  # a busy loop held to its CPU limit, so cgroups report constant throttling.
  replicas: 100
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      nodeSelector:
        nma-soak/pool: soak
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *labels
      terminationGracePeriodSeconds: 5
      containers:
        - name: burn
          image: public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
          command: ["/bin/bash", "-c", "while :; do :; done"]
          resources:
            requests: {cpu: 50m, memory: 8Mi}
            limits: {cpu: 50m, memory: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem-steady
  namespace: {{ .Namespace }}
  labels: &labels
    app.kubernetes.io/part-of: nma-soak
    app.kubernetes.io/component: background
    nma-soak/flavor: mem-steady
spec:
  # holds 64Mi of resident memory for its whole life.
  replicas: 100
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      nodeSelector:
        nma-soak/pool: soak
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *labels
      terminationGracePeriodSeconds: 5
      containers:
        - name: hold
          image: public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
          command: ["/bin/bash", "-c", "x=$(head -c 64M /dev/zero | tr '\\0' a); exec sleep infinity"]
          resources:
            requests: {cpu: 5m, memory: 80Mi}
            limits: {memory: 160Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger
  namespace: {{ .Namespace }}
  labels: &labels
    app.kubernetes.io/part-of: nma-soak
    app.kubernetes.io/component: background
    nma-soak/flavor: logger
spec:
  # 10 lines/s each to stdout, ~150 lines/s per node of container log volume.
  replicas: 150
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      nodeSelector:
        nma-soak/pool: soak
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *labels
      terminationGracePeriodSeconds: 5
      containers:
        - name: log
          image: public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
          command: ["/bin/bash", "-c", "i=0; while :; do echo \"nma-soak log line $((i++)) $(date +%s%N)\"; sleep 0.1; done"]
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-container
  namespace: {{ .Namespace }}
  labels: &labels
    app.kubernetes.io/part-of: nma-soak
    app.kubernetes.io/component: background
    nma-soak/flavor: multi-container
spec:
  # several containers plus an init container per pod.
  replicas: 140
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      nodeSelector:
        nma-soak/pool: soak
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *labels
      terminationGracePeriodSeconds: 5
      initContainers:
        - name: init
          image: public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
          command: ["/bin/bash", "-c", "echo initialized > /work/ready"]
          volumeMounts:
            - {name: work, mountPath: /work}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 16Mi}
      containers:
        - name: main
          image: public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
          command: ["/bin/bash", "-c", "cat /work/ready; exec sleep infinity"]
          volumeMounts:
            - {name: work, mountPath: /work}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 16Mi}
        - name: sidecar-a
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 1m, memory: 4Mi}
            limits: {memory: 16Mi}
        - name: sidecar-b
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 1m, memory: 4Mi}
            limits: {memory: 16Mi}
      volumes:
        - name: work
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop
  namespace: {{ .Namespace }}
  labels: &labels
    app.kubernetes.io/part-of: nma-soak
    app.kubernetes.io/component: background
    nma-soak/flavor: crashloop
spec:
  # exits non-zero after 30s, so the runtime monitor sees repeated restarts.
  replicas: 10
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      nodeSelector:
        nma-soak/pool: soak
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *labels
      terminationGracePeriodSeconds: 5
      containers:
        - name: crash
          image: public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
          command: ["/bin/bash", "-c", "sleep 30; exit 1"]
          resources:
            requests: {cpu: 1m, memory: 4Mi}
            limits: {memory: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom
  namespace: {{ .Namespace }}
  labels: &labels
    app.kubernetes.io/part-of: nma-soak
    app.kubernetes.io/component: background
    nma-soak/flavor: oom
spec:
  # allocates past its 32Mi limit, so the kernel OOM-kills it on every start.
  replicas: 10
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      nodeSelector:
        nma-soak/pool: soak
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *labels
      terminationGracePeriodSeconds: 5
      containers:
        - name: oom
          image: public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
          command: ["/bin/bash", "-c", "sleep 30; x=$(head -c 64M /dev/zero | tr '\\0' a); sleep infinity"]
          resources:
            requests: {cpu: 1m, memory: 16Mi}
            limits: {memory: 32Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: short-jobs
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/part-of: nma-soak
    app.kubernetes.io/component: background
    nma-soak/flavor: short-jobs
spec:
  # low-rate pod churn on the soak nodes: 10 short-lived pods every minute.
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      parallelism: 10
      completions: 10
      ttlSecondsAfterFinished: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: nma-soak
            app.kubernetes.io/component: background
            nma-soak/flavor: short-jobs
        spec:
          restartPolicy: Never
          nodeSelector:
            nma-soak/pool: soak
          containers:
            - name: job
              image: public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
              command: ["/bin/bash", "-c", "sleep 5"]
              resources:
                requests: {cpu: 5m, memory: 8Mi}
                limits: {memory: 16Mi}
