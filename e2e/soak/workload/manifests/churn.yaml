# Shared objects used by every churn pod. The pods themselves are created and
# deleted by the churn driver from the templates in churn-pods.yaml.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nma-soak-efs
  labels:
    app.kubernetes.io/part-of: nma-soak
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: {{ .EFSFileSystemID }}
  directoryPerms: "700"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nma-soak-efs
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/part-of: nma-soak
spec:
  # one RWX volume shared by every churn pod, so each pod start and stop
  # publishes and unpublishes an EFS mount on the churn node.
  accessModes: ["ReadWriteMany"]
  storageClassName: nma-soak-efs
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nma-soak-churn
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/part-of: nma-soak
# tokens are mounted explicitly as projected volumes in churn-pods.yaml.
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nma-soak-churn
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/part-of: nma-soak
spec:
  # selecting every churn pod makes the VPC CNI network policy agent attach
  # eBPF programs to each pod as it starts and detach them as it stops.
  podSelector:
    matchLabels:
      app.kubernetes.io/component: churn
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 80}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {}
